<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order details · Shop Admin</title>
    <style>
      :root {
        --navy: #182433;
        --navy-light: #26384d;
        --blue: #206bc4;
        --page: #f4f6fa;
        --border: #dce1e7;
        --text: #182433;
        --muted: #667382;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--page);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px 1fr;
      }
      .sidebar {
        background: var(--navy);
        color: #b8c2cc;
        padding: 1.25rem 0.75rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.45rem 0.65rem 1.5rem;
        color: #fff;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .deploy-button {
        margin-left: auto;
        border: 1px solid #516173;
        border-radius: 5px;
        padding: 0.35rem 0.6rem;
        color: white;
        background: transparent;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .deploy-button:hover:not(:disabled) {
        background: var(--navy-light);
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: var(--blue);
        font-size: 0.9rem;
      }
      .nav-label {
        padding: 0.5rem 0.65rem;
        color: #8291a2;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 0.75rem;
        margin: 0.12rem 0;
        border-radius: 6px;
        color: #c4ced8;
        text-decoration: none;
        font-size: 0.92rem;
      }
      .nav-item.active,
      .nav-item:hover {
        background: var(--navy-light);
        color: #fff;
      }
      .nav-icon {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .content {
        min-width: 0;
      }
      .page {
        max-width: 1180px;
        padding: 2rem 2.25rem 3rem;
        margin: auto;
      }
      .breadcrumb {
        display: flex;
        gap: 0.45rem;
        margin-bottom: 0.6rem;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .breadcrumb a {
        color: var(--muted);
        text-decoration: none;
      }
      .page-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.55rem;
      }
      .subtitle {
        margin: 0.3rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .btn {
        display: inline-flex;
        padding: 0.55rem 0.8rem;
        border: 1px solid #cdd5df;
        border-radius: 5px;
        background: #fff;
        color: #405366;
        font-size: 0.86rem;
        font-weight: 600;
        text-decoration: none;
      }
      .btn:hover {
        background: #f4f6fa;
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(260px, 1fr);
        gap: 1.25rem;
      }
      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 1px 2px #1824330a;
      }
      .card h2 {
        margin: 0;
        padding: 1rem 1.15rem;
        border-bottom: 1px solid var(--border);
        font-size: 1rem;
      }
      .items {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      .items th {
        padding: 0.7rem 1.15rem;
        background: #fafbfc;
        border-bottom: 1px solid var(--border);
        color: #6c7885;
        font-size: 0.7rem;
        text-transform: uppercase;
      }
      .items td {
        padding: 1rem 1.15rem;
        border-bottom: 1px solid #edf0f3;
        font-size: 0.88rem;
      }
      .items tr:last-child td {
        border: 0;
      }
      .product {
        font-weight: 650;
      }
      .variant {
        display: block;
        margin-top: 0.2rem;
        color: var(--muted);
        font-size: 0.76rem;
      }
      .money {
        text-align: right;
        white-space: nowrap;
      }
      .summary {
        margin: 0;
        padding: 0.7rem 1.15rem 1rem;
      }
      .summary-row {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.45rem 0;
        color: var(--muted);
        font-size: 0.86rem;
      }
      .summary-row strong {
        color: var(--text);
      }
      .summary-row.total {
        margin-top: 0.4rem;
        padding-top: 0.85rem;
        border-top: 1px solid var(--border);
        color: var(--text);
        font-size: 0.95rem;
      }
      .meta {
        padding: 0.7rem 1.15rem 1rem;
      }
      .meta-row {
        padding: 0.55rem 0;
      }
      .meta-label {
        display: block;
        margin-bottom: 0.25rem;
        color: var(--muted);
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .meta-value {
        font-size: 0.88rem;
        overflow-wrap: anywhere;
      }
      .status {
        display: inline-flex;
        padding: 0.25rem 0.55rem;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: capitalize;
      }
      .status-paid {
        color: #18794e;
        background: #e6f6ee;
      }
      .status-pending {
        color: #8a6100;
        background: #fff4ce;
      }
      .status-payment_failed {
        color: #b42318;
        background: #feeceb;
      }
      .status-expired {
        color: #596579;
        background: #edf0f4;
      }
      .loading {
        grid-column: 1/-1;
        padding: 3.5rem;
        text-align: center;
        color: var(--muted);
      }
      @media (max-width: 800px) {
        .shell {
          display: block;
        }
        .sidebar {
          display: flex;
          align-items: center;
          overflow: auto;
          padding: 0.6rem;
        }
        .brand {
          padding: 0.25rem 0.7rem 0.25rem 0.2rem;
        }
        .brand-name,
        .nav-label,
        .nav-item[href="/documentation"] {
          display: none;
        }
        .nav-item {
          white-space: nowrap;
        }
        .page {
          padding: 1.25rem 1rem;
        }
        .page-heading {
          align-items: flex-start;
          flex-direction: column;
        }
        .layout {
          grid-template-columns: 1fr;
        }
        .items-wrap {
          overflow: auto;
        }
        .items {
          min-width: 580px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">S</span><span class="brand-name">Shop Admin</span>
          <button
            class="deploy-button"
            type="button"
            onclick="fetch('/admin/deploy', { method: 'POST' })"
          >
            Save
          </button>
        </div>
        <div class="nav-label">Catalog</div>
        <a class="nav-item" href="/admin/"
          ><svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M3 21v-13l9-5 9 5v13h-6v-6h-6v6z" /></svg
          >Products</a
        ><a class="nav-item" href="/admin/product-options"
          ><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg
          >Product options</a
        >
        <div class="nav-label" style="margin-top: 1rem">Sales</div>
        <a class="nav-item active" href="/admin/orders"
          ><svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M6 7h12l1 14H5L6 7zM9 9V6a3 3 0 0 1 6 0v3" /></svg
          >Orders</a
        >
        <div class="nav-label" style="margin-top: 1rem">System</div>
        <a class="nav-item" href="/documentation"
          ><svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M4 19.5v-15a2 2 0 0 1 2-2h12v19h-12a2 2 0 0 1-2-2zM8 7h6M8 11h6" /></svg
          >API documentation</a
        >
      </aside>
      <div class="content">
        <main class="page">
          <div class="breadcrumb">
            <a href="/admin/orders">Orders</a><span>›</span><span id="crumb">Order</span>
          </div>
          <div class="page-heading">
            <div>
              <h1 id="title">Order details</h1>
              <p class="subtitle" id="subtitle">Loading order…</p>
            </div>
            <a class="btn" href="/admin/orders">Back to orders</a>
          </div>
          <div class="layout" id="layout">
            <div class="card loading">Loading order details…</div>
          </div>
        </main>
      </div>
    </div>
    <script>
      const layout = document.querySelector("#layout"),
        title = document.querySelector("#title"),
        subtitle = document.querySelector("#subtitle"),
        crumb = document.querySelector("#crumb")
      const id = location.pathname.split("/").filter(Boolean).at(-1)
      const escapeHtml = (value) =>
        String(value ?? "").replace(
          /[&<>'"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '"': "&quot;" })[c],
        )
      const statusLabel = (value) => ({ payment_failed: "Payment failed" })[value] || value
      const money = (amount, currency) =>
        new Intl.NumberFormat(undefined, {
          style: "currency",
          currency: currency.toUpperCase(),
        }).format(amount / 100)
      fetch(`/orders/${id}`)
        .then((response) => {
          if (!response.ok)
            throw new Error(response.status === 404 ? "Order not found" : "Could not load order")
          return response.json()
        })
        .then((order) => {
          title.textContent = `Order #${order.id}`
          crumb.textContent = `#${order.id}`
          subtitle.textContent = `Placed ${new Intl.DateTimeFormat(undefined, { dateStyle: "long", timeStyle: "short" }).format(new Date(order.createdAt))}`
          document.title = `Order #${order.id} · Shop Admin`
          const totals = order.items.reduce((all, item) => {
            all[item.currency] = (all[item.currency] || 0) + item.unitAmount * item.quantity
            return all
          }, {})
          layout.innerHTML = `<section class="card"><h2>Items</h2><div class="items-wrap"><table class="items"><thead><tr><th>Product</th><th>Unit price</th><th>Quantity</th><th class="money">Total</th></tr></thead><tbody>${order.items.map((item) => `<tr><td><span class="product">${escapeHtml(item.productName)}</span><span class="variant">Variant #${item.variantId}</span></td><td>${escapeHtml(money(item.unitAmount, item.currency))}</td><td>${item.quantity}</td><td class="money">${escapeHtml(money(item.unitAmount * item.quantity, item.currency))}</td></tr>`).join("")}</tbody></table></div><div class="summary">${Object.entries(
            totals,
          )
            .map(
              ([currency, amount]) =>
                `<div class="summary-row total"><strong>Order total${Object.keys(totals).length > 1 ? ` (${escapeHtml(currency.toUpperCase())})` : ""}</strong><strong>${escapeHtml(money(amount, currency))}</strong></div>`,
            )
            .join(
              "",
            )}</div></section><aside class="card"><h2>Order information</h2><div class="meta"><div class="meta-row"><span class="meta-label">Status</span><span class="status status-${escapeHtml(order.status)}">${escapeHtml(statusLabel(order.status))}</span></div><div class="meta-row"><span class="meta-label">Order ID</span><span class="meta-value">#${order.id}</span></div><div class="meta-row"><span class="meta-label">Created</span><span class="meta-value">${escapeHtml(new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "medium" }).format(new Date(order.createdAt)))}</span></div><div class="meta-row"><span class="meta-label">Checkout session</span><span class="meta-value">${escapeHtml(order.checkoutSessionId || "Not assigned")}</span></div></div></aside>`
        })
        .catch((error) => {
          subtitle.textContent = "Unable to display this order."
          layout.innerHTML = `<div class="card loading"><strong>${escapeHtml(error.message)}</strong><br><br><a class="btn" href="/admin/orders">Return to orders</a></div>`
        })
    </script>
  </body>
</html>
