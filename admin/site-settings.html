<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Site settings · Shop Admin</title>
    <style>
      :root {
        --navy: #182433;
        --navy-light: #26384d;
        --blue: #206bc4;
        --blue-hover: #1a5aa5;
        --page: #f4f6fa;
        --border: #dce1e7;
        --text: #182433;
        --muted: #667382;
        --danger: #d63939;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--page);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
      }
      button,
      input,
      textarea {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px 1fr;
      }
      .sidebar {
        background: var(--navy);
        color: #b8c2cc;
        display: flex;
        flex-direction: column;
        padding: 1.25rem 0.75rem;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 0.7rem;
        padding: 0.45rem 0.65rem 1.5rem;
        color: white;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .deploy-button {
        margin-left: auto;
        border: 1px solid #516173;
        border-radius: 5px;
        padding: 0.35rem 0.6rem;
        color: white;
        background: transparent;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .deploy-button:hover:not(:disabled) {
        background: var(--navy-light);
      }
      .deploy-saved {
        color: #7bd88f;
        font-size: 0.75rem;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: var(--blue);
        font-size: 0.9rem;
      }
      .nav-label {
        padding: 0.5rem 0.65rem;
        color: #8291a2;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.7rem 0.75rem;
        margin: 0.12rem 0;
        border-radius: 6px;
        color: #c4ced8;
        text-decoration: none;
        font-size: 0.92rem;
      }
      .nav-item.active,
      .nav-item:hover {
        background: var(--navy-light);
        color: white;
      }
      .nav-icon {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }
      .content {
        min-width: 0;
      }
      .page {
        max-width: 1380px;
        padding: 2rem 2.25rem 3rem;
        margin: 0 auto;
      }
      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 0.45rem;
        margin-bottom: 0.6rem;
        color: var(--muted);
        font-size: 0.82rem;
      }
      .breadcrumb span {
        color: #a1abb7;
      }
      .page-heading {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      h1 {
        margin: 0;
        font-size: 1.55rem;
        letter-spacing: -0.03em;
      }
      .subtitle {
        margin: 0.3rem 0 0;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        border: 1px solid transparent;
        border-radius: 5px;
        padding: 0.55rem 0.8rem;
        font-size: 0.86rem;
        font-weight: 600;
      }
      .btn-primary {
        background: var(--blue);
        color: white;
      }
      .btn-primary:hover {
        background: var(--blue-hover);
      }
      .btn-outline {
        color: #405366;
        background: white;
        border-color: #cdd5df;
      }
      .btn-outline:hover {
        background: #f4f6fa;
      }
      .btn-danger {
        color: var(--danger);
        background: white;
        border-color: #eeb9b9;
      }
      .btn-danger:hover {
        color: white;
        background: var(--danger);
      }
      .btn-icon {
        width: 31px;
        height: 31px;
        padding: 0;
      }
      .card {
        overflow: hidden;
        background: white;
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: 0 2px 5px rgb(24 36 51 / 5%);
      }
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        min-height: 64px;
        padding: 0.85rem 1.15rem;
        border-bottom: 1px solid var(--border);
      }
      .result-count {
        color: var(--muted);
        font-size: 0.78rem;
      }
      .search {
        width: 250px;
        padding: 0.5rem 0.7rem;
        border: 1px solid #cdd5df;
        border-radius: 5px;
        outline-color: var(--blue);
        font-size: 0.84rem;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th {
        padding: 0.75rem 1.15rem;
        color: var(--muted);
        background: #fbfcfd;
        border-bottom: 1px solid var(--border);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        text-align: left;
        text-transform: uppercase;
      }
      td {
        padding: 0.9rem 1.15rem;
        border-bottom: 1px solid #edf0f3;
        font-size: 0.88rem;
        vertical-align: middle;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: #f8fafc;
      }
      .label-key {
        color: #1e5a9e;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 600;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .option {
        padding: 0.22rem 0.48rem;
        color: #405366;
        background: #edf2f7;
        border-radius: 4px;
        font-size: 0.78rem;
      }
      .actions {
        display: flex;
        justify-content: flex-end;
      }
      .empty {
        padding: 4rem 1rem;
        color: var(--muted);
        text-align: center;
      }
      .empty strong {
        display: block;
        margin-bottom: 0.3rem;
        color: #405366;
        font-size: 0.92rem;
      }
      .toast {
        position: fixed;
        z-index: 30;
        right: 1.5rem;
        bottom: 1.5rem;
        min-width: 260px;
        padding: 0.8rem 1rem;
        color: white;
        background: #2fb344;
        border-radius: 7px;
        box-shadow: 0 8px 25px rgb(0 0 0 / 20%);
        font-size: 0.86rem;
        font-weight: 600;
      }
      .toast.error {
        background: var(--danger);
      }
      .modal-backdrop {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 1rem;
        background: rgb(24 36 51 / 48%);
      }
      .modal {
        width: min(100%, 540px);
        background: white;
        border-radius: 7px;
        box-shadow: 0 15px 40px rgb(0 0 0 / 25%);
      }
      .modal-header,
      .modal-footer {
        display: flex;
        align-items: center;
        padding: 1rem 1.25rem;
      }
      .modal-header {
        justify-content: space-between;
        border-bottom: 1px solid var(--border);
      }
      .modal-header h2 {
        margin: 0;
        font-size: 1.05rem;
      }
      .modal-body {
        display: grid;
        gap: 1rem;
        padding: 1.25rem;
      }
      .modal-footer {
        justify-content: flex-end;
        gap: 0.6rem;
        border-top: 1px solid var(--border);
      }
      .close {
        border: 0;
        background: transparent;
        color: var(--muted);
        font-size: 1.4rem;
        line-height: 1;
      }
      label {
        display: grid;
        gap: 0.4rem;
        color: #405366;
        font-size: 0.84rem;
        font-weight: 600;
      }
      input,
      textarea {
        width: 100%;
        padding: 0.58rem 0.65rem;
        border: 1px solid #cdd5df;
        border-radius: 5px;
        color: var(--text);
        outline-color: var(--blue);
      }
      textarea {
        min-height: 130px;
        resize: vertical;
      }
      .field-help,
      #status {
        margin: 0;
        color: var(--muted);
        font-size: 0.78rem;
      }
      #status.error {
        color: var(--danger);
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 800px) {
        .shell {
          display: block;
        }
        .sidebar {
          position: sticky;
          z-index: 5;
          top: 0;
          flex-direction: row;
          align-items: center;
          gap: 0.25rem;
          padding: 0.55rem 0.75rem;
          overflow-x: auto;
          box-shadow: 0 2px 10px rgb(0 0 0 / 16%);
        }
        .brand {
          flex: 0 0 auto;
          margin-right: auto;
          padding: 0;
          font-size: 0.95rem;
        }
        .brand-mark {
          width: 28px;
          height: 28px;
        }
        .nav-label,
        .nav-item[href="/documentation"] {
          display: none;
        }
        .nav-item {
          flex: 0 0 auto;
          gap: 0.4rem;
          margin: 0;
          padding: 0.55rem 0.6rem;
          font-size: 0.82rem;
        }
        .nav-icon {
          width: 16px;
          height: 16px;
        }
        .page {
          padding: 1.25rem 1rem 2rem;
        }
        .page-heading {
          align-items: stretch;
          flex-direction: column;
          margin-bottom: 1rem;
        }
        .page-heading > .btn {
          min-height: 44px;
        }
        h1 {
          font-size: 1.4rem;
        }
        input,
        textarea {
          font-size: 16px;
        }
        .card {
          overflow: visible;
          border: 0;
          background: transparent;
          box-shadow: none;
        }
        .card-header {
          align-items: stretch;
          flex-direction: column-reverse;
          min-height: auto;
          margin-bottom: 0.65rem;
          padding: 0;
          border: 0;
        }
        .search {
          width: 100%;
        }
        table,
        tbody {
          display: block;
        }
        thead {
          display: none;
        }
        tbody {
          display: grid;
          gap: 0.65rem;
        }
        tbody tr {
          position: relative;
          display: grid;
          gap: 0.35rem;
          padding: 0.85rem 3.75rem 0.85rem 1rem;
          background: white;
          border: 1px solid var(--border);
          border-radius: 8px;
          box-shadow: 0 2px 5px rgb(24 36 51 / 5%);
        }
        tbody tr:hover {
          background: white;
        }
        td {
          display: block;
          padding: 0;
          border: 0;
        }
        td:first-child {
          color: var(--muted) !important;
          font-size: 0.72rem;
        }
        td:nth-child(2) {
          font-size: 0.98rem;
        }
        td:nth-child(4) {
          position: absolute;
          top: 50%;
          right: 0.85rem;
          transform: translateY(-50%);
        }
        td.empty {
          padding: 2.5rem 1rem;
        }
        .btn-icon {
          width: 40px;
          height: 40px;
        }
        .modal-backdrop {
          align-items: end;
          padding: 0;
        }
        .modal {
          width: 100%;
          max-height: calc(100dvh - 1rem);
          overflow-y: auto;
          border-radius: 14px 14px 0 0;
        }
        .modal-header,
        .modal-body,
        .modal-footer {
          padding: 1rem;
        }
        .modal-footer .btn {
          min-height: 44px;
          flex: 1;
        }
        .toast {
          right: 1rem;
          bottom: 1rem;
          left: 1rem;
          min-width: 0;
        }
      }
      @media (max-width: 430px) {
        .brand-name {
          display: none;
        }
        .nav-item {
          padding-inline: 0.5rem;
        }
      }
      .language-list {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 0.75rem;
        padding: 1.15rem;
      }
      .language-choice {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.8rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: white;
        cursor: pointer;
      }
      .language-choice input {
        width: 18px;
        height: 18px;
        accent-color: var(--blue);
      }
      .language-choice small {
        display: block;
        margin-top: 0.2rem;
        color: var(--muted);
      }
      fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        min-width: 0;
      }
      .settings-footer {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1.15rem;
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">S</span><span class="brand-name">Shop Admin</span>
          <button
            class="deploy-button"
            type="button"
            onclick="
              this.nextElementSibling.hidden = false
              fetch('/admin/deploy', { method: 'POST' })
            "
          >
            Save
          </button>
          <span class="deploy-saved" hidden>Saved!</span>
        </div>
        <div class="nav-label">Catalog</div>
        <a class="nav-item" href="/admin/"
          ><svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M3 21v-13l9-5 9 5v13h-6v-6h-6v6z" /></svg
          >Products</a
        >
        <a class="nav-item" href="/admin/product-options"
          ><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" /></svg
          >Product options</a
        >
        <div class="nav-label" style="margin-top: 1rem">Sales</div>
        <a class="nav-item" href="/admin/orders"
          ><svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M6 7h12l1 14H5L6 7zM9 9V6a3 3 0 0 1 6 0v3" /></svg
          >Orders</a
        >
        <div class="nav-label" style="margin-top: 1rem">System</div>
        <a class="nav-item active" href="/admin/site-settings"
          ><svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16M8 4v6M16 9v6M10 14v6" /></svg
          >Site settings</a
        >
        <a class="nav-item" href="/documentation"
          ><svg class="nav-icon" viewBox="0 0 24 24">
            <path d="M4 19.5v-15a2 2 0 0 1 2-2h12v19h-12a2 2 0 0 1-2-2z" />
            <path d="M8 7h6M8 11h6" /></svg
          >API documentation</a
        >
      </aside>
      <div class="content">
        <main class="page">
          <div class="breadcrumb">System <span>›</span> Site settings</div>
          <div class="page-heading">
            <div>
              <h1>Site settings</h1>
              <p class="subtitle">Choose the languages supported by your site.</p>
            </div>
          </div>
          <form id="settings-form" class="card">
            <header class="card-header">
              <h2 style="margin: 0; font-size: 1rem">Supported languages</h2>
              <span class="result-count" id="selection-count"></span>
            </header>
            <fieldset id="language-fields" disabled aria-label="Supported languages">
              <div class="language-list" id="languages">Loading languages…</div>
            </fieldset>
            <footer class="settings-footer">
              <button class="btn btn-primary" id="save-settings" disabled>Save settings</button>
              <p id="settings-status" role="status" aria-live="polite"></p>
              <button class="btn btn-outline" type="button" id="retry" hidden>Retry</button>
            </footer>
          </form>
        </main>
      </div>
    </div>
    <script>
      const form = document.querySelector("#settings-form")
      const fields = document.querySelector("#language-fields")
      const languages = document.querySelector("#languages")
      const save = document.querySelector("#save-settings")
      const status = document.querySelector("#settings-status")
      const count = document.querySelector("#selection-count")
      const retry = document.querySelector("#retry")
      const selectedCodes = () =>
        [...fields.querySelectorAll("input:checked")].map((input) => input.value)
      const updateCount = () => {
        count.textContent = `${selectedCodes().length} selected`
      }
      const loadSettings = async () => {
        retry.hidden = true
        status.textContent = ""
        try {
          const responses = await Promise.all([
            fetch("/site-settings/languages"),
            fetch("/site-settings"),
          ])
          if (responses.some((response) => !response.ok))
            throw new Error("Could not load site settings.")
          const [catalog, settings] = await Promise.all(
            responses.map((response) => response.json()),
          )
          const selected = new Set(settings.supportedLanguages.map((language) => language.code))
          languages.replaceChildren()
          for (const language of catalog) {
            const label = document.createElement("label")
            label.className = "language-choice"
            const input = document.createElement("input")
            input.type = "checkbox"
            input.name = "supportedLanguages"
            input.value = language.code
            input.checked = language.selected
            const text = document.createElement("span")
            const name = document.createElement("span")
            name.textContent = language.label
            name.lang = language.code
            name.dir = "auto"
            const code = document.createElement("small")
            code.textContent = language.code
            text.append(name, code)
            label.append(input, text)
            languages.append(label)
          }
          fields.disabled = false
          save.disabled = false
          updateCount()
        } catch {
          languages.textContent = "Languages could not be loaded."
          status.textContent = "Could not load site settings. Please retry."
          retry.hidden = false
        }
      }
      fields.addEventListener("change", () => {
        updateCount()
        status.textContent = "Unsaved changes"
      })
      retry.addEventListener("click", loadSettings)
      form.addEventListener("submit", async (event) => {
        event.preventDefault()
        const codes = selectedCodes()
        save.disabled = true
        fields.disabled = true
        status.textContent = "Saving…"
        try {
          const response = await fetch("/site-settings", {
            method: "PUT",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ supportedLanguages: codes }),
          })
          if (!response.ok) throw new Error("Could not save site settings.")
          status.textContent = "Site settings saved."
        } catch {
          status.textContent = "Could not save site settings. Please try again."
        } finally {
          save.disabled = false
          fields.disabled = false
        }
      })
      loadSettings()
    </script>
  </body>
</html>
