<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in · Shop Admin</title>
    <style>
      :root {
        --navy: #182433;
        --blue: #206bc4;
        --blue-hover: #1a569d;
        --danger: #d63939;
        --page: #f4f6fa;
        --border: #dce1e7;
        --text: #182433;
        --muted: #667382;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: var(--page);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
      }
      .login {
        width: 100%;
        max-width: 380px;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.7rem;
        margin-bottom: 1.5rem;
        font-size: 1.15rem;
        font-weight: 700;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: var(--blue);
        color: #fff;
        font-size: 0.9rem;
      }
      .card {
        display: grid;
        gap: 1rem;
        padding: 1.5rem;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      h1 {
        margin: 0;
        font-size: 1.15rem;
      }
      label {
        display: grid;
        gap: 0.4rem;
        font-size: 0.86rem;
        font-weight: 600;
      }
      input {
        width: 100%;
        padding: 0.6rem 0.75rem;
        border: 1px solid #cdd5df;
        border-radius: 5px;
        font: inherit;
        font-weight: 400;
        color: inherit;
      }
      input:focus {
        outline: 2px solid #206bc433;
        border-color: var(--blue);
      }
      button {
        padding: 0.65rem 0.8rem;
        border: 0;
        border-radius: 5px;
        background: var(--blue);
        color: #fff;
        font: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: var(--blue-hover);
      }
      button:disabled {
        cursor: default;
        opacity: 0.6;
      }
      .error {
        margin: 0;
        color: var(--danger);
        font-size: 0.86rem;
      }
      .error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main class="login">
      <div class="brand"><span class="brand-mark">S</span>Shop Admin</div>
      <form class="card" id="login">
        <h1>Log in</h1>
        <label
          >Email <input name="email" type="email" autocomplete="username" required autofocus
        /></label>
        <label
          >Password <input name="password" type="password" autocomplete="current-password" required
        /></label>
        <p class="error" id="error" role="alert"></p>
        <button type="submit">Log in</button>
      </form>
    </main>
    <script>
      const form = document.querySelector("#login"),
        error = document.querySelector("#error"),
        submit = form.querySelector("button")
      const next = new URLSearchParams(location.search).get("next")
      const destination = next && /^\/(admin|documentation)(\/|$)/.test(next) ? next : "/admin/"

      form.addEventListener("submit", async (event) => {
        event.preventDefault()
        error.textContent = ""
        submit.disabled = true
        try {
          const response = await fetch("/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: form.email.value, password: form.password.value }),
          })
          if (response.ok) return location.replace(destination)
          error.textContent =
            response.status === 401 ? "Invalid email or password." : "Could not log in. Try again."
        } catch {
          error.textContent = "Could not log in. Try again."
        }
        submit.disabled = false
      })
    </script>
  </body>
</html>
